name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          # pip wheel cache, keyed on the Python version and pyproject.toml
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[test]"

      - name: Unit tests
        # Fully mocked HTTP (responses); no network and no API key needed.
        run: pytest -q
